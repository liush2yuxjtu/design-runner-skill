---
name: tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests -p 'test_*.py' -v
      - run: python scripts/runner.py check --json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/pi-design-mcp/package-lock.json
      - run: npm ci
        working-directory: extensions/pi-design-mcp
      - run: npm test
        working-directory: extensions/pi-design-mcp
      - run: npm run typecheck
        working-directory: extensions/pi-design-mcp
